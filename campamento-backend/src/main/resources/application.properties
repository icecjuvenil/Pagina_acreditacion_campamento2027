# Nombre de la aplicación
spring.application.name=campamento

# Carga las credenciales locales si existe el archivo privado
spring.config.import=optional:classpath:application-local.properties

# Conexión con la base de datos
spring.datasource.url=jdbc:mysql://localhost:3306/campamento_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=America/Santiago
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Configuración de JPA durante el desarrollo
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# Puerto del servidor
server.port=8080
