<!DOCTYPE html>
<html lang="es">

<head>
    <!--Configuración general de la página-->
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reconectados con la cruz | Elegidos ICEC Juvenil</title>

    <!--Archivo de estilos-->
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- Encabezado y menú principal -->
     <header class="encabezado">
        <a href="#inicio" class="marca">
            <img src="Logos/logo-elegidos.png" alt="Logo Elegidos ICEC Juvenil">
            <span>Elegidos ICEC Juvenil</span>
        </a>

        <nav class="menu-principal" aria-label="Navegación principal">
            <a href="index.html">Inicio</a>
            <a href="#informacion">Información</a>
            <a href="acreditacion.html">Acreditación</a>
            <a href="#contacto">Contacto</a>
        </nav>

     </header>

     <!--Contenido principal del sitio-->
     <main>

        <!--Portada del campamento actual-->
        <section id="inicio" class="portada">

            <!--Titulo principal para accesibilidad y buscadores-->
            <h1 class="titulo-oculto">
                Reconectados a la Cruz - Campamento ICEC 2027
            </h1>

            <!--Afiche oficial -->
            <img src="Logos/oficial.png" 
                alt="Reconectados a la Cruz - Campamento ICEC 2027" 
                class="afiche-oficial">

            <!--Infomacion ubicada debebajo del afiche-->
            <div class="portada-informacion">
                <!--Fecha y contador-->
                <div class="portada-informacion">

                    <p class="etiqueta">
                        campamento Juvenil 2027
                    </p>

                    <p class="fecha-campamento">
                        8, 9 y 10 de enero del 2027
                    </p>

                    <!--Contador actualizado mediante inicio.js-->
                    <p
                        class="contador-campamento"
                        
                    ></p>
                </div>
            </div>

               
        </section>
     </main>

     <!--Contador del campamento-->
     <script src="inicio.js"></script>
    
</body>
