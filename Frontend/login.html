
<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0">

    <title>Iniciar sesión | Elegidos ICEC Juvenil</title>

    <link rel="stylesheet" href="style.css">

    <!-- Cloudflare Turnstile -->
    <script
        src="https://challenges.cloudflare.com/turnstile/v0/api.js"
        async
        defer>
    </script>
</head>

<body class="pagina-acreditacion pagina-login">

    <!-- ENCABEZADO PRINCIPAL -->
    <header class="encabezado">

        <a href="index.html" class="marca">
            <img
                src="Logos/logo-elegidos.png"
                alt="Logo Elegidos ICEC Juvenil">

            <span>ICEC JUVENIL</span>

        </a>

        <nav
            class="menu-principal"
            aria-label="Navegación principal">

            <a href="index.html">
                Inicio
            </a>

            <a href="index.html#informacion">
                Información
            </a>

            <a
                href="login.html"
                aria-current="page">
                Acreditación
            </a>

            <a href="index.html#contacto">
                Contacto
            </a>

        </nav>
    </header>

    <!-- BANNER -->
    <section
        class="banner-acreditacion"
        aria-labelledby="titulo-banner-login">

        <img
            src="Logos/imagen.png"
            alt="Jóvenes reunidos alrededor de una fogata">

        <div class="contenido-banner-acreditacion">

            <h1 id="titulo-banner-login">

                <span>Reiniciados</span>

                <strong>A la Cruz</strong>
            </h1>

            <p>Campamento ICEC 2027</p>

        </div>

    </section>

    <!-- INICIO DE SESIÓN -->
    <main class="contenido-login">

        <section
            class="seccion-login"
            aria-labelledby="titulo-login">

            <div class="cabecera-login">

                <h2 id="titulo-login">
                    Acreditación
                </h2>

                <p>
                    Ingresa a tu cuenta para continuar
                    con tu acreditación.
                </p>

            </div>

            <div class="tarjeta-login">

                <form
                    id="formulario-login"
                    class="formulario-login">

                    <!-- CORREO -->
                    <div class="campo-login">

                        <label for="correo-login">
                            Correo electrónico
                        </label>

                        <div class="control-login">

                            <svg
                                viewBox="0 0 24 24"
                                aria-hidden="true">

                                <rect
                                    x="3"
                                    y="5"
                                    width="18"
                                    height="14"
                                    rx="2">
                                </rect>

                                <path d="m3 7 9 6 9-6"></path>

                            </svg>

                            <input
                                type="email"
                                id="correo-login"
                                name="correo"
                                autocomplete="email"
                                maxlength="150"
                                required>

                        </div>
                    </div>

                    <!-- CONTRASEÑA -->
                    <div class="campo-login">

                        <label for="contrasena-login">
                            Contraseña
                        </label>

                        <div class="control-login">

                            <svg
                                viewBox="0 0 24 24"
                                aria-hidden="true">

                                <rect
                                    x="5"
                                    y="10"
                                    width="14"
                                    height="11"
                                    rx="2">
                                </rect>

                                <path
                                    d="M8 10V7a4 4 0 0 1 8 0v3">
                                </path>

                            </svg>

                            <input
                                type="password"
                                id="contrasena-login"
                                name="contrasena"
                                autocomplete="current-password"
                                maxlength="128"
                                required>

                        </div>
                    </div>

                    <!-- RECUPERAR CONTRASEÑA -->
                    <div class="opciones-login">

                        <a
                            href="recuperar-contrasena.html"
                            class="enlace-recuperacion">

                            ¿Olvidaste tu contraseña?
                        </a>

                    </div>

                    <!-- VERIFICACIÓN TURNSTILE -->
                    <!-- CLAVE DE PRODUCCIÓN -->
                    <!-- <div
                        class="cf-turnstile"
                        data-sitekey="0x4AAAAAAFsHJQwPGsRUwZEf">
                        
                    </div> -->
                    <!-- CLAVE DE PRUEBA LOCAL -->
                    <div class="cf-turnstile" data-sitekey="1x00000000000000000000AA"></div>

                    <!-- MENSAJES DEL SISTEMA -->
                    <p
                        id="mensaje-login"
                        role="status"
                        aria-live="polite"
                        style="margin: 12px 0;">
                    </p>

                    <!-- BOTÓN DE INICIO -->
                    <button
                        type="submit"
                        id="boton-iniciar-sesion"
                        class="boton-login">

                        Iniciar sesión
                    </button>

                </form>

                <!-- INFORMACIÓN DE SESIÓN -->
                <div
                    id="panel-sesion"
                    hidden>

                    <h3>Sesión iniciada</h3>

                    <p id="nombre-usuario"></p>

                    <p id="correo-usuario"></p>

                    <button
                        type="button"
                        id="boton-cerrar-sesion"
                        class="boton-login">

                        Cerrar sesión
                    </button>

                </div>

                <!-- CREAR CUENTA -->
                <div
                    id="crear-cuenta-login"
                    class="crear-cuenta-login">

                    <p>¿Aún no tienes una cuenta?</p>

                    <a
                        href="acreditacion.html"
                        class="boton-crear-cuenta">

                        Crear perfil y acreditarme
                    </a>

                </div>

            </div>

        </section>

    </main>

    <!-- LÓGICA DEL INICIO DE SESIÓN -->
    <script src="login.js"></script>

</body>
</html>
