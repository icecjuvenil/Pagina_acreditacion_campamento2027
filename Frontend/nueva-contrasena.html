<!DOCTYPE html>
<html lang="es">

<head>
    <!-- Configuración general -->
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0">

    <title>Nueva contraseña | Elegidos ICEC Juvenil</title>

    <!-- Icono de la página -->
    <link
        rel="icon"
        type="image/png"
        href="Logos/logo-elegidos-blanco.jpg">

    <!-- Estilos generales -->
    <link rel="stylesheet" href="style.css">
</head>

<body class="pagina-acreditacion pagina-login pagina-recuperacion pagina-nueva-clave">

    <!-- ==================================================
         ENCABEZADO PRINCIPAL
         ================================================== -->

    <header class="encabezado">

        <a href="index.html" class="marca">

            <img
                src="Logos/logo-elegidos.png"
                alt="Logo Elegidos ICEC Juvenil">

            <span>ICEC JUVENIL</span>

        </a>

        <nav
            class="menu-principal"
            aria-label="Navegación principal">

            <a href="index.html">
                Inicio
            </a>

            <a href="login.html">
                Iniciar sesión
            </a>

        </nav>

    </header>

        <!-- Fotografía del campamento -->
    <section
        class="banner-acreditacion banner-nueva-contrasena"
        aria-label="Campamento ICEC 2027">

        <img
            src="Logos/imagen.png"
            alt="Jóvenes reunidos alrededor de una fogata junto al lago">

    </section>

    <!-- ==================================================
         CREAR NUEVA CONTRASEÑA
         ================================================== -->

    <main class="contenido-login">

        <section
            class="seccion-login"
            aria-labelledby="titulo-nueva-contrasena">

            <!-- Presentación -->
            <div class="cabecera-login">

                <h2 id="titulo-nueva-contrasena">
                    Crear nueva contraseña
                </h2>

                <p>
                    Ingresa la contraseña provisoria que recibiste
                    por correo y elige tu nueva contraseña.
                </p>

            </div>

            <!-- Tarjeta del formulario -->
            <div class="tarjeta-login">

                <!-- Encabezado de la tarjeta -->
                <div class="cabecera-seguridad">

                    <span class="icono-seguridad" aria-hidden="true">
                        <svg viewBox="0 0 24 24">
                            <rect
                                x="5"
                                y="10"
                                width="14"
                                height="11"
                                rx="2">
                            </rect>

                            <path d="M8 10V7a4 4 0 0 1 8 0v3"></path>
                        </svg>
                    </span>

                    <h3>Protege tu cuenta</h3>

                </div>

                <form
                    id="formulario-nueva-contrasena"
                    class="formulario-login"
                    method="post">

                    <!-- Correo asociado a la cuenta -->
                    <div class="campo-login">

                        <label for="correo-nueva-contrasena">
                            Correo electrónico
                        </label>

                        <div class="control-login">

                            <svg
                                viewBox="0 0 24 24"
                                aria-hidden="true"
                                focusable="false">

                                <rect
                                    x="3"
                                    y="5"
                                    width="18"
                                    height="14"
                                    rx="2">
                                </rect>

                                <path d="m3 7 9 6 9-6"></path>

                            </svg>

                            <input
                                type="email"
                                id="correo-nueva-contrasena"
                                name="correo"
                                autocomplete="email"
                                placeholder="nombre@correo.cl"
                                required>

                        </div>

                    </div>

                    <!-- Contraseña provisoria -->
                    <div class="campo-login">

                        <label for="contrasena-provisoria">
                            Contraseña provisoria
                        </label>

                        <div class="control-login">

                            <svg
                                viewBox="0 0 24 24"
                                aria-hidden="true"
                                focusable="false">

                                <rect
                                    x="5"
                                    y="10"
                                    width="14"
                                    height="11"
                                    rx="2">
                                </rect>

                                <path
                                    d="M8 10V7a4 4 0 0 1 8 0v3">
                                </path>

                            </svg>

                            <input
                                type="password"
                                id="contrasena-provisoria"
                                name="contrasenaProvisoria"
                                autocomplete="one-time-code"
                                placeholder="Ingresa la contraseña provisoria"
                                spellcheck="false"
                                required>

                        </div>

                    </div>

                    <!-- Nueva contraseña -->
                    <div class="campo-login">

                        <label for="nueva-contrasena">
                            Nueva contraseña
                        </label>

                        <div class="control-login">

                            <svg
                                viewBox="0 0 24 24"
                                aria-hidden="true"
                                focusable="false">

                                <rect
                                    x="5"
                                    y="10"
                                    width="14"
                                    height="11"
                                    rx="2">
                                </rect>

                                <path
                                    d="M8 10V7a4 4 0 0 1 8 0v3">
                                </path>

                            </svg>

                            <input
                                type="password"
                                id="nueva-contrasena"
                                name="nuevaContrasena"
                                autocomplete="new-password"
                                placeholder="Escribe tu nueva contraseña"
                                required>

                        </div>

                    </div>

                    <!-- Confirmación de la nueva contraseña -->
                    <div class="campo-login">

                        <label for="confirmar-nueva-contrasena">
                            Confirmar nueva contraseña
                        </label>

                        <div class="control-login">

                            <svg
                                viewBox="0 0 24 24"
                                aria-hidden="true"
                                focusable="false">

                                <rect
                                    x="5"
                                    y="10"
                                    width="14"
                                    height="11"
                                    rx="2">
                                </rect>

                                <path
                                    d="M8 10V7a4 4 0 0 1 8 0v3">
                                </path>

                            </svg>

                            <input
                                type="password"
                                id="confirmar-nueva-contrasena"
                                name="confirmarNuevaContrasena"
                                autocomplete="new-password"
                                placeholder="Repite tu nueva contraseña"
                                required>

                        </div>

                    </div>

                    <!-- Mostrar u ocultar las contraseñas -->
                    <label class="opcion-mostrar-contrasenas">

                        <input
                            type="checkbox"
                            id="mostrar-contrasenas">

                        <span>Mostrar contraseñas</span>

                    </label>

                    <!-- Botón pendiente de conectar -->
                    <button
                        type="submit"
                        id="guardar-nueva-contrasena"
                        class="boton-login"
                        aria-describedby="mensaje-nueva-contrasena"
                        disabled>

                        Guardar nueva contraseña

                    </button>

                    <!-- Mensajes del formulario -->
                    <p
                        id="mensaje-nueva-contrasena"
                        role="status"
                        aria-live="polite">

                        Completa los campos para crear tu nueva contraseña.

                    </p>

                </form>

                <!-- Solicitar otra contraseña provisoria -->
                <div class="volver-login">

                    <a href="recuperar-contrasena.html">
                        Solicitar otra contraseña provisoria
                    </a>

                </div>

                <!-- Regreso al inicio de sesión -->
                <div class="volver-login">

                    <a href="login.html">
                        Volver al inicio de sesión
                    </a>

                </div>

            </div>

        </section>

    </main>

    <!-- Funciones del formulario -->
    <script src="nueva-contrasena.js"></script>

</body>

</html>
