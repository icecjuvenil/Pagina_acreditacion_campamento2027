<!DOCTYPE html>
<html lang="es">

<head>
    <!-- Configuración general de la página -->
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0">

    <title>Recuperar contraseña | Elegidos ICEC Juvenil</title>

    <!-- Estilos generales del sitio -->
    <link rel="stylesheet" href="style.css">
</head>

<body class="pagina-acreditacion pagina-login pagina-recuperacion">

    <!-- ==================================================
         ENCABEZADO PRINCIPAL
         ================================================== -->
    <header class="encabezado">

        <!-- Logo y nombre de Instagram -->
        <a href="index.html" class="marca">

            <img
                src="Logos/logo-elegidos.png"
                alt="Logo Elegidos ICEC Juvenil">

            <span>@ICECJUVENIL</span>

        </a>

        <!-- Navegación principal -->
        <nav
            class="menu-principal"
            aria-label="Navegación principal">

            <a href="index.html">
                Inicio
            </a>

            <a href="index.html#informacion">
                Información
            </a>

            <a
                href="login.html"
                aria-current="page">
                Acreditación
            </a>

            <a href="index.html#contacto">
                Contacto
            </a>

        </nav>

    </header>

    <!-- ==================================================
         BANNER DEL CAMPAMENTO
         ================================================== -->
    <section
        class="banner-acreditacion"
        aria-labelledby="titulo-banner-recuperacion">

        <img
            src="Logos/imagen.png"
            alt="Jóvenes reunidos alrededor de una fogata">

        <div class="contenido-banner-acreditacion">

            <h1 id="titulo-banner-recuperacion">

                <span>Reconciliado</span>

                <strong>A la Cruz</strong>

            </h1>

            <p>Campamento ICEC 2027</p>

        </div>

    </section>

    <!-- ==================================================
         RECUPERACIÓN DE CONTRASEÑA
         ================================================== -->
    <main class="contenido-login">

        <section
            class="seccion-login"
            aria-labelledby="titulo-recuperacion">

            <!-- Presentación de la sección -->
            <div class="cabecera-login">

                <h2 id="titulo-recuperacion">
                    Recuperar contraseña
                </h2>

                <p>
                    Ingresa el correo asociado a tu cuenta.
                </p>

            </div>

            <!-- Tarjeta de recuperación -->
            <div class="tarjeta-login">

                <form
                    id="formulario-recuperacion"
                    class="formulario-login">

                    <!-- Correo de la cuenta -->
                    <div class="campo-login">

                        <label for="correo-recuperacion">
                            Correo electrónico
                        </label>

                        <div class="control-login">

                            <!-- Icono de correo -->
                            <svg
                                viewBox="0 0 24 24"
                                aria-hidden="true">

                                <rect
                                    x="3"
                                    y="5"
                                    width="18"
                                    height="14"
                                    rx="2">
                                </rect>

                                <path d="m3 7 9 6 9-6"></path>

                            </svg>

                            <input
                                type="email"
                                id="correo-recuperacion"
                                name="correo"
                                autocomplete="email"
                                required>

                        </div>

                    </div>

                    <!-- Se conectará al envío de correos posteriormente -->
                    <button
                        type="button"
                        class="boton-login">

                        Enviar enlace de recuperación
                    </button>

                </form>

                <!-- Regreso al inicio de sesión -->
                <div class="volver-login">

                    <a href="login.html">
                        Volver al inicio de sesión
                    </a>

                </div>

            </div>

        </section>

    </main>

</body>

</html>
