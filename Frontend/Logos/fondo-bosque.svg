        <use href="#pino" transform="translate(925 92) scale(.66)"/>
        <use href="#pino" transform="translate(1040 65) scale(.84)"/>
        <use href="#pino" transform="translate(1185 88) scale(.70)"/>
        <use href="#pino" transform="translate(1320 55) scale(.90)"/>
        <use href="#pino" transform="translate(1480 85) scale(.72)"/>
    </g>

    <!-- Bosque delantero -->
    <g fill="#879d80" opacity="0.14">
